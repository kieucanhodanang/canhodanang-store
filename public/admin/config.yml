# Decap CMS | canhodanang.store | Nâng cấp dữ liệu dự án
backend:
  name: github
  repo: kieucanhodanang/canhodanang-store
  branch: main
  base_url: https://canhodanang.store
  auth_endpoint: auth
media_folder: public/uploads
public_folder: /uploads
locale: vi
slug:
  encoding: ascii
  clean_accents: true
collections:
- name: can-ho
  label: Căn hộ
  label_singular: Căn hộ
  folder: src/content/can-ho
  create: true
  extension: md
  format: frontmatter
  slug: '{{slug}}'
  identifier_field: title
  fields:
  - &id002
    label: Tiêu đề bài đăng
    name: title
    widget: string
  - &id003
    label: Mô tả SEO (khoảng 140–160 ký tự, viết tự nhiên)
    name: description
    widget: text
  - &id004
    label: SEO Title riêng (để trống dùng tiêu đề)
    name: seoTitle
    widget: string
    required: false
  - &id016
    label: Thuộc dự án
    name: project
    widget: relation
    required: false
    collection: du-an
    search_fields: &id028
    - title
    value_field: '{{slug}}'
    display_fields: &id029
    - title
  - &id017
    label: Hình thức giao dịch
    name: transaction
    widget: select
    options:
    - label: Bán
      value: ban
    - label: Cho thuê dài hạn
      value: cho-thue
    - label: Cho thuê theo ngày
      value: cho-thue-ngay
    default: ban
  - &id018
    label: Tình trạng giao dịch
    name: listingStatus
    widget: select
    options:
    - label: Còn giao dịch
      value: available
    - label: Đã bán / Đã cho thuê
      value: closed
    - label: Tạm ngừng
      value: paused
    default: available
  - label: Giá bán hoặc cho thuê
    name: price
    widget: string
  - &id023
    label: Giá để lọc (triệu đồng)
    name: priceValue
    widget: number
    value_type: float
    min: 0
    required: false
    hint: 'Nhập số, không kèm đơn vị. Bán: 3,5 tỷ = 3500. Thuê tháng: 15 triệu = 15. Thuê ngày: 800 nghìn/đêm = 0.8.'
  - &id021
    label: Diện tích (m²)
    name: area
    widget: string
  - &id022
    label: Diện tích để lọc (m²)
    name: areaValue
    widget: number
    value_type: float
    min: 0
    required: false
    hint: Nhập số, ví dụ 75.5. Thanh trượt trang chủ hiển thị khoảng 25–125 m².
  - &id026
    label: Số phòng ngủ
    name: bedrooms
    widget: number
    required: false
    value_type: int
    min: 0
  - &id027
    label: Số phòng vệ sinh
    name: bathrooms
    widget: number
    required: false
    value_type: int
    min: 0
  - label: Khu vực căn hộ (danh mục SEO)
    name: areaSlug
    widget: select
    required: false
    hint: Chọn khu vực để phân loại căn hộ trên website. Giữ nguyên Quận / Khu vực và Phường / Xã bên dưới để ghi địa chỉ
      thực tế.
    options:
    - label: Sơn Trà
      value: son-tra
    - label: Ngũ Hành Sơn
      value: ngu-hanh-son
    - label: Hải Châu
      value: hai-chau
  - label: Quận / Khu vực
    name: district
    widget: select
    options: &id030
    - label: Hải Châu
      value: Hải Châu
    - label: Sơn Trà
      value: Sơn Trà
    - label: Ngũ Hành Sơn
      value: Ngũ Hành Sơn
    - label: Thanh Khê
      value: Thanh Khê
    - label: Liên Chiểu
      value: Liên Chiểu
    - label: Cẩm Lệ
      value: Cẩm Lệ
    - label: Hòa Vang
      value: Hòa Vang
    - label: Khu vực khác
      value: Khu vực khác
    required: false
  - &id020
    label: Phường / Xã
    name: ward
    widget: string
    required: false
  - label: Địa chỉ bất động sản
    name: address
    widget: string
  - &id025
    label: Thông tin pháp lý
    name: legal
    widget: string
    required: false
  - label: Hướng căn hộ
    name: direction
    widget: select
    required: false
    options: &id001
    - Đông
    - Tây
    - Nam
    - Bắc
    - Đông Bắc
    - Đông Nam
    - Tây Bắc
    - Tây Nam
  - label: Hướng ban công
    name: balconyDirection
    widget: select
    required: false
    options: *id001
  - &id024
    label: Nội thất
    name: interior
    widget: string
    required: false
    hint: 'Ví dụ: Đầy đủ nội thất, Nội thất cơ bản, Bàn giao thô.'
  - &id005
    label: Thư viện hình ảnh
    name: gallery
    widget: list
    required: false
    field:
      label: Hình ảnh
      name: image
      widget: image
  - &id006
    label: Ảnh chia sẻ mạng xã hội
    name: ogImage
    widget: image
    required: false
  - &id007
    label: Ảnh đại diện
    name: image
    widget: image
  - &id008
    label: Alt Text ảnh đại diện
    name: imageAlt
    widget: string
    required: false
  - &id009
    label: Ngày đăng
    name: date
    widget: datetime
    required: false
    date_format: YYYY-MM-DD
    time_format: HH:mm
    format: YYYY-MM-DDTHH:mm:ss
  - &id010
    label: Ngày cập nhật
    name: updatedAt
    widget: datetime
    required: false
    date_format: YYYY-MM-DD
    time_format: HH:mm
    format: YYYY-MM-DDTHH:mm:ss
  - &id011
    label: Trạng thái xuất bản
    name: status
    widget: select
    options:
    - label: Công khai
      value: published
    - label: Bản nháp / Ẩn
      value: draft
    default: published
  - &id012
    label: Hiển thị trên trang chủ
    name: showOnHome
    widget: boolean
    default: true
  - &id013
    label: Ghim nổi bật trên trang chủ
    name: featured
    widget: boolean
    default: false
  - &id014
    label: Thứ tự ưu tiên (số nhỏ lên trước)
    name: featuredOrder
    widget: number
    required: false
    value_type: int
    min: 1
  - &id015
    label: Nội dung chi tiết
    name: body
    widget: markdown
- name: du-an
  label: Dự án bất động sản
  label_singular: Dự án bất động sản
  folder: src/content/du-an
  create: true
  extension: md
  format: frontmatter
  slug: '{{fields.slug}}'
  identifier_field: title
  fields:
  - *id002
  - label: SEO Title riêng (để trống để hệ thống tự tạo)
    name: seoTitle
    widget: string
    required: false
    hint: 'Tiêu đề trang trên Google. Nếu để trống, hệ thống dùng tên và vị trí dự án.'
  - label: Meta Description riêng (để trống để hệ thống tự tạo)
    name: seoDescription
    widget: text
    required: false
    hint: 'Viết mô tả SEO tự nhiên, khoảng 140–160 ký tự. Không ảnh hưởng phần giới thiệu hiển thị trên trang.'
  - label: Slug dự án (đường dẫn URL)
    name: slug
    widget: string
    required: true
    pattern:
    - ^[a-z0-9]+(?:-[a-z0-9]+)*$
    - 'Chỉ dùng chữ thường không dấu, số và dấu gạch ngang. Ví dụ: capital-square'
    hint: 'Ví dụ: capital-square. Không nhập /du-an/ hoặc .md. Sau khi xuất bản không nên đổi slug vì sẽ đổi URL.'
  - *id003
  - label: Chủ đầu tư
    name: developer
    widget: string
    required: false
  - label: Vị trí dự án
    name: location
    widget: string
  - label: Quận / Khu vực dự án
    name: district
    widget: select
    required: false
    options: &id019
    - Hải Châu
    - Sơn Trà
    - Ngũ Hành Sơn
    - Thanh Khê
    - Liên Chiểu
    - Cẩm Lệ
    - Hòa Vang
    - Khu vực khác
    hint: Dùng để tự động lấy các dự án liên quan cùng quận.
  - label: Tổng diện tích dự án
    name: totalArea
    widget: string
    required: false
    hint: 'Ví dụ: 2,5 ha hoặc 25.000 m²'
  - label: Số tòa
    name: towerCount
    widget: string
    required: false
  - label: Số căn hộ / biệt thự
    name: unitCount
    widget: string
    required: false
  - label: Thời gian bàn giao dự kiến
    name: handoverDate
    widget: string
    required: false
  - label: Mật độ xây dựng
    name: buildingDensity
    widget: string
    required: false
  - label: Nội dung mặt bằng dự án
    name: floorPlanText
    widget: text
    required: false
  - label: Hình ảnh mặt bằng dự án
    name: floorPlanImages
    widget: list
    required: false
    field:
      label: Ảnh mặt bằng
      name: image
      widget: image
  - label: Nội dung tiến độ dự án
    name: progressText
    widget: text
    required: false
  - label: Các lần cập nhật tiến độ
    name: progressItems
    widget: list
    required: false
    summary: '{{fields.title}}'
    fields:
    - label: Tiêu đề H3 của ảnh / video
      name: title
      widget: string
    - label: Nội dung cập nhật
      name: description
      widget: text
      required: false
    - label: Hình ảnh tiến độ
      name: image
      widget: image
      required: false
    - label: Link video YouTube
      name: videoUrl
      widget: string
      required: false
      hint: Dán link YouTube thông thường hoặc YouTube Shorts.
    - label: Tệp video tải lên (MP4/WebM)
      name: videoFile
      widget: file
      required: false
      hint: Chỉ dùng video dung lượng nhỏ; ưu tiên YouTube để tránh tăng dung lượng GitHub và Cloudflare.
  - label: Loại hình trong dự án
    name: propertyTypes
    widget: select
    required: false
    multiple: true
    options:
    - label: Căn hộ
      value: can-ho
    - label: Biệt thự
      value: biet-thu
    - label: Shophouse
      value: shophouse
    - label: Nhà phố
      value: nha-pho
    - label: Đất nền
      value: dat-nen
  - *id005
  - *id006
  - *id007
  - *id008
  - label: Logo dự án (hiển thị trong dải logo Footer)
    name: logo
    widget: image
    required: false
    hint: Ưu tiên PNG/WebP nền trong suốt, ảnh ngang rõ nét.
  - label: Alt Text logo dự án
    name: logoAlt
    widget: string
    required: false
  - label: Trạng thái phân phối
    name: distributionStatus
    widget: select
    default: dang-phan-phoi
    options:
    - label: Đang phân phối
      value: dang-phan-phoi
    - label: Sắp mở bán
      value: sap-mo-ban
    - label: Ngừng phân phối
      value: ngung-phan-phoi
  - label: Hiển thị logo trong Footer
    name: showLogoInFooter
    widget: boolean
    default: true
  - label: Thứ tự logo Footer (số nhỏ ưu tiên trước)
    name: logoOrder
    widget: number
    required: false
    value_type: int
    min: 1
  - label: Hiển thị dự án trong menu dropdown
    name: showInMenu
    widget: boolean
    default: true
  - *id009
  - *id010
  - *id011
  - *id012
  - *id013
  - *id014
  - *id015
- name: biet-thu
  label: Biệt thự & Shophouse
  label_singular: Biệt thự & Shophouse
  folder: src/content/biet-thu
  create: true
  extension: md
  format: frontmatter
  slug: '{{slug}}'
  identifier_field: title
  fields:
  - *id002
  - *id003
  - *id004
  - label: Loại hình
    name: propertyType
    widget: select
    options:
    - label: Biệt thự
      value: biet-thu
    - label: Shophouse
      value: shophouse
    default: biet-thu
  - *id016
  - *id017
  - *id018
  - label: Quận / Khu vực
    name: district
    widget: select
    options: *id019
    required: false
  - *id020
  - label: Địa chỉ
    name: address
    widget: string
    required: false
  - *id021
  - *id022
  - label: Giá bán / cho thuê
    name: price
    widget: string
    required: false
  - *id023
  - &id031
    label: Mặt tiền (m)
    name: frontage
    widget: string
    required: false
    hint: 'Ví dụ: 5,5 m.'
  - &id032
    label: Đường vào (m)
    name: roadWidth
    widget: number
    value_type: float
    min: 0
    required: false
    hint: Chiều rộng đường vào tính bằng mét, ví dụ 5.5.
  - *id024
  - *id025
  - &id033
    label: Số tầng
    name: floors
    widget: number
    value_type: int
    min: 1
    required: false
    hint: Nhập số tầng của nhà hoặc biệt thự, ví dụ 3. Để trống nếu không áp dụng.
  - *id026
  - *id027
  - &id034
    label: Hướng
    name: direction
    widget: select
    required: false
    options: *id001
  - *id005
  - *id006
  - *id007
  - *id008
  - *id009
  - *id010
  - *id011
  - *id012
  - *id013
  - *id014
  - *id015
- name: tho-cu
  label: Nhà đất thổ cư
  label_singular: Nhà đất thổ cư
  folder: src/content/tho-cu
  create: true
  extension: md
  format: frontmatter
  slug: '{{slug}}'
  identifier_field: title
  fields:
  - *id002
  - *id003
  - *id004
  - label: Thuộc dự án (nếu có)
    name: project
    widget: relation
    required: false
    collection: du-an
    search_fields: *id028
    value_field: '{{slug}}'
    display_fields: *id029
  - label: Loại tài sản
    name: propertyType
    widget: select
    options:
    - label: Nhà riêng
      value: nha-rieng
    - label: Đất thổ cư
      value: dat-tho-cu
  - label: Hình thức giao dịch
    name: transaction
    widget: select
    options:
    - label: Bán
      value: ban
    - label: Cho thuê
      value: cho-thue
    default: ban
  - *id018
  - label: Quận / Khu vực
    name: district
    widget: select
    options: *id030
    required: true
  - label: Địa chỉ
    name: address
    widget: string
  - label: Giá bán
    name: price
    widget: string
  - *id023
  - label: Diện tích đất
    name: area
    widget: string
  - *id022
  - *id020
  - *id031
  - *id032
  - *id024
  - *id025
  - *id033
  - *id026
  - *id027
  - *id034
  - *id005
  - *id006
  - *id007
  - *id008
  - *id009
  - *id010
  - *id011
  - *id012
  - *id013
  - *id014
  - *id015
- name: bai-viet
  label: Tin tức và bài viết SEO
  label_singular: Tin tức và bài viết SEO
  folder: src/content/bai-viet
  create: true
  extension: md
  format: frontmatter
  slug: '{{slug}}'
  identifier_field: title
  fields:
  - *id002
  - *id003
  - *id004
  - label: Danh mục bài viết
    name: category
    widget: select
    required: false
    options:
    - label: Tin thị trường
      value: thi-truong
    - label: Thông tin dự án
      value: du-an
    - label: Căn hộ Đà Nẵng
      value: can-ho
    - label: Nhà đất thổ cư
      value: tho-cu
    - label: Pháp lý BĐS
      value: phap-ly
    - label: Kinh nghiệm mua bán
      value: kinh-nghiem
  - label: Tin tức thuộc dự án (tự động liên kết)
    name: project
    widget: relation
    required: false
    collection: du-an
    search_fields: *id028
    value_field: '{{slug}}'
    display_fields: *id029
    hint: Chọn dự án để bài viết tự động xuất hiện trong phần Tin tức về dự án.
  - *id006
  - *id007
  - *id008
  - label: Ngày đăng
    name: date
    widget: datetime
    required: true
    date_format: YYYY-MM-DD
    time_format: HH:mm
    format: YYYY-MM-DDTHH:mm:ss
  - *id010
  - *id011
  - *id012
  - *id013
  - *id014
  - *id015
- name: cai-dat-trang-chu
  label: Cài đặt trang chủ
  files:
  - name: trang-chu
    label: Banner và giao diện trang chủ
    file: src/data/homepage.json
    format: json
    fields:
    - label: Banner quảng cáo cố định hai bên (desktop)
      name: floatingBanners
      widget: object
      required: false
      collapsed: false
      hint: Banner xuất hiện khi cuộn qua đầu trang và mờ dần gần cuối trang.
      fields:
      - label: Banner bên trái
        name: left
        widget: object
        required: false
        fields:
        - label: Bật banner trái
          name: enabled
          widget: boolean
          default: false
        - label: Ảnh banner trái (JPG, PNG, WebP hoặc GIF)
          name: image
          widget: image
          required: false
        - label: Liên kết khi nhấn
          name: link
          widget: string
          required: false
          hint: 'Ví dụ: /du-an/capital-square/ hoặc https://example.com'
        - label: Mô tả ảnh
          name: alt
          widget: string
          required: false
      - label: Banner bên phải
        name: right
        widget: object
        required: false
        fields:
        - label: Bật banner phải
          name: enabled
          widget: boolean
          default: false
        - label: Ảnh banner phải (JPG, PNG, WebP hoặc GIF)
          name: image
          widget: image
          required: false
        - label: Liên kết khi nhấn
          name: link
          widget: string
          required: false
          hint: 'Ví dụ: /can-ho/ hoặc https://example.com'
        - label: Mô tả ảnh
          name: alt
          widget: string
          required: false
    - label: Danh sách slide banner trang chủ
      name: bannerSlides
      widget: list
      required: false
      hint: Có thể thêm nhiều slide. Khi chưa có slide, giao diện tiếp tục dùng banner cũ cho đến khi cập nhật code Astro.
      fields:
      - label: Bật hiển thị
        name: enabled
        widget: boolean
        default: true
      - label: Ảnh desktop
        name: image
        widget: image
      - label: Ảnh mobile (không bắt buộc)
        name: mobileImage
        widget: image
        required: false
      - label: Alt Text hình ảnh
        name: imageAlt
        widget: string
      - label: Dòng chữ nhỏ
        name: eyebrow
        widget: string
        required: false
      - label: Tiêu đề slide
        name: title
        widget: string
      - label: Mô tả
        name: description
        widget: text
        required: false
      - label: Chữ nút
        name: buttonText
        widget: string
        required: false
      - label: Liên kết nút
        name: buttonLink
        widget: string
        required: false
    - label: Ảnh banner trang chủ
      name: bannerImage
      widget: image
      required: false
      hint: Ảnh ngang khoảng 1920x900px, JPG hoặc WebP
    - label: Alt Text ảnh banner
      name: bannerAlt
      widget: string
      required: false
      hint: Mô tả đúng nội dung ảnh, không nhồi từ khóa
    - label: Dòng chữ nhỏ trên banner
      name: bannerEyebrow
      widget: string
      required: false
    - label: Tiêu đề chính
      name: bannerTitle
      widget: string
    - label: Mô tả banner
      name: bannerDescription
      widget: text
      required: false
    - label: Chữ nút chính
      name: primaryButtonText
      widget: string
      required: false
    - label: Đường dẫn nút chính
      name: primaryButtonLink
      widget: string
      required: false
    - label: Chữ nút liên hệ
      name: secondaryButtonText
      widget: string
      required: false
    - label: Đường dẫn nút liên hệ
      name: secondaryButtonLink
      widget: string
      required: false
    - label: Chiều cao banner (px)
      name: bannerHeight
      widget: number
      value_type: int
      min: 350
      max: 850
      step: 10
      default: 610
    - label: Kích thước tiêu đề (px)
      name: bannerTitleSize
      widget: number
      value_type: int
      min: 32
      max: 80
      step: 2
      default: 56
    - label: Chiều rộng nội dung (px)
      name: bannerContentWidth
      widget: number
      value_type: int
      min: 800
      max: 1400
      step: 50
      default: 1200
    - label: Vị trí ảnh banner
      name: bannerPosition
      widget: select
      options:
      - label: Phía trên
        value: top
      - label: Chính giữa
        value: center
      - label: Phía dưới
        value: bottom
      default: center
    - label: Độ tối ảnh nền (%)
      name: bannerOverlay
      widget: number
      value_type: int
      min: 0
      max: 80
      step: 5
      default: 45
    - label: Màu nút chính
      name: primaryButtonColor
      widget: string
      default: '#D4A85E'
      hint: 'Nhập mã màu HEX, ví dụ #D4A85E'
    - label: Căn chỉnh nội dung
      name: bannerTextAlign
      widget: select
      options:
      - label: Căn trái
        value: left
      - label: Căn giữa
        value: center
      - label: Căn phải
        value: right
      default: left
    - label: Thời gian tự chuyển slide (giây)
      name: slideInterval
      widget: number
      value_type: int
      min: 3
      max: 12
      default: 5
      required: false
