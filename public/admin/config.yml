- name: cai-dat-trang-chu
  label: Cài đặt trang chủ
  files:
  - name: trang-chu
    label: Banner và giao diện trang chủ
    file: src/data/homepage.json
    format: json
    fields:
    - label: Danh sách slide banner trang chủ
      name: bannerSlides
      widget: list
      required: false
      hint: Có thể thêm nhiều slide. Khi chưa có slide, giao diện tiếp tục dùng banner cũ cho đến khi cập nhật
        code Astro.
      fields:
      - label: Bật hiển thị
        name: enabled
        widget: boolean
        default: true
      - label: Ảnh desktop
        name: image
        widget: image
      - label: Ảnh mobile (không bắt buộc)
        name: mobileImage
        widget: image
        required: false
      - label: Alt Text hình ảnh
        name: imageAlt
        widget: string
      - label: Dòng chữ nhỏ
        name: eyebrow
        widget: string
        required: false
      - label: Tiêu đề slide
        name: title
        widget: string
      - label: Mô tả
        name: description
        widget: text
        required: false
      - label: Chữ nút
        name: buttonText
        widget: string
        required: false
      - label: Liên kết nút
        name: buttonLink
        widget: string
        required: false
    - label: Ảnh banner trang chủ
      name: bannerImage
      widget: image
      required: false
      hint: Ảnh ngang khoảng 1920x900px, JPG hoặc WebP
    - label: Alt Text ảnh banner
      name: bannerAlt
      widget: string
      required: false
      hint: Mô tả đúng nội dung ảnh, không nhồi từ khóa
    - label: Dòng chữ nhỏ trên banner
      name: bannerEyebrow
      widget: string
      required: false
    - label: Tiêu đề chính
      name: bannerTitle
      widget: string
    - label: Mô tả banner
      name: bannerDescription
      widget: text
      required: false
    - label: Chữ nút chính
      name: primaryButtonText
      widget: string
      required: false
    - label: Đường dẫn nút chính
      name: primaryButtonLink
      widget: string
      required: false
    - label: Chữ nút liên hệ
      name: secondaryButtonText
      widget: string
      required: false
    - label: Đường dẫn nút liên hệ
      name: secondaryButtonLink
      widget: string
      required: false
    - label: Chiều cao banner (px)
      name: bannerHeight
      widget: number
      value_type: int
      min: 350
      max: 850
