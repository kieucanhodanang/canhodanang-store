- name: cai-dat-trang-chu
  label: Cài đặt trang chủ
  files:
  - name: trang-chu
    label: Banner và giao diện trang chủ
    file: src/data/homepage.json
    format: json
    fields:
    - label: Logo website (Header desktop và mobile)
      name: siteLogo
      widget: image
      required: false
      hint: Nên dùng PNG/WebP nền trong suốt, logo rõ nét.
    - label: Favicon website (biểu tượng trên tab trình duyệt)
      name: siteFavicon
      widget: image
      required: false
      hint: Ưu tiên PNG vuông 512x512 hoặc SVG. Nếu để trống dùng favicon mặc định.
    - label: Ảnh đại diện căn hộ theo khu vực
      name: areaImages
      widget: object
      required: false
      fields:
      - label: Ảnh căn hộ Sơn Trà
        name: sonTra
        widget: image
        required: false
      - label: Ảnh căn hộ Ngũ Hành Sơn
        name: nguHanhSon
        widget: image
        required: false
      - label: Ảnh căn hộ Hải Châu
        name: haiChau
        widget: image
        required: false
    - label: Ảnh đại diện nhà đất thổ cư theo khu vực
      name: landAreaImages
      widget: object
      required: false
      fields:
      - label: Ảnh nhà đất Sơn Trà
        name: sonTra
        widget: image
        required: false
      - label: Ảnh nhà đất Hải Châu
        name: haiChau
        widget: image
        required: false
      - label: Ảnh nhà đất Thanh Khê
        name: thanhKhe
        widget: image
        required: false
    - label: Ảnh đại diện cho thuê theo khu vực (căn hộ và nhà đất)
      name: rentalAreaImages
      widget: object
      required: false
      fields:
      - label: Ảnh cho thuê Sơn Trà
        name: sonTra
        widget: image
        required: false
      - label: Ảnh cho thuê Hải Châu
        name: haiChau
        widget: image
        required: false
      - label: Ảnh cho thuê Thanh Khê
        name: thanhKhe
        widget: image
        required: false
      - label: Ảnh cho thuê Ngũ Hành Sơn
        name: nguHanhSon
        widget: image
        required: false
      - label: Ảnh cho thuê Liên Chiểu
        name: lienChieu
        widget: image
        required: false
      - label: Ảnh cho thuê Cẩm Lệ
        name: camLe
        widget: image
        required: false
    - label: Banner quảng cáo cố định hai bên (desktop)
      name: floatingBanners
      widget: object
      required: false
      collapsed: false
      hint: Banner xuất hiện khi cuộn qua đầu trang và mờ dần gần cuối trang.
      fields:
      - label: Banner bên trái
        name: left
        widget: object
        required: false
        fields:
        - label: Bật banner trái
          name: enabled
          widget: boolean
          default: false
        - label: Ảnh banner trái (JPG, PNG, WebP hoặc GIF)
          name: image
          widget: image
          required: false
        - label: Liên kết khi nhấn
          name: link
          widget: string
          required: false
          hint: 'Ví dụ: /du-an/capital-square/ hoặc https://example.com'
        - label: Mô tả ảnh
          name: alt
          widget: string
          required: false
      - label: Banner bên phải
        name: right
        widget: object
        required: false
        fields:
        - label: Bật banner phải
          name: enabled
          widget: boolean
          default: false
        - label: Ảnh banner phải (JPG, PNG, WebP hoặc GIF)
          name: image
          widget: image
          required: false
        - label: Liên kết khi nhấn
          name: link
          widget: string
          required: false
          hint: 'Ví dụ: /can-ho/ hoặc https://example.com'
        - label: Mô tả ảnh
          name: alt
          widget: string
          required: false
    - label: Video nền banner chính (MP4/WebM)
      name: bannerVideo
      widget: file
      required: false
      hint: Video ngắn 6–12 giây, nên dưới 5 MB. Để trống sẽ dùng ảnh dự phòng.
    - label: Ảnh dự phòng cho video nền
      name: bannerVideoPoster
      widget: image
      required: false
      hint: Hiển thị khi video chưa chạy, bị lỗi hoặc trên điện thoại.
    - label: Danh sách slide banner trang chủ (dữ liệu cũ, không còn chạy slideshow)
      name: bannerSlides
      widget: list
      required: false
      hint: Có thể thêm nhiều slide. Khi chưa có slide, giao diện tiếp tục dùng banner cũ cho đến khi cập nhật code Astro.
      fields:
      - label: Bật hiển thị
        name: enabled
        widget: boolean
        default: true
      - label: Ảnh desktop
        name: image
        widget: image
      - label: Ảnh mobile (không bắt buộc)
        name: mobileImage
        widget: image
        required: false
      - label: Alt Text hình ảnh
        name: imageAlt
        widget: string
      - label: Dòng chữ nhỏ
        name: eyebrow
        widget: string
        required: false
      - label: Tiêu đề slide
        name: title
        widget: string
      - label: Mô tả
        name: description
        widget: text
        required: false
      - label: Chữ nút
        name: buttonText
        widget: string
        required: false
      - label: Liên kết nút
        name: buttonLink
        widget: string
        required: false
    - label: Ảnh banner trang chủ
      name: bannerImage
      widget: image
      required: false
      hint: Ảnh ngang khoảng 1920x900px, JPG hoặc WebP
    - label: Alt Text ảnh banner
      name: bannerAlt
      widget: string
      required: false
      hint: Mô tả đúng nội dung ảnh, không nhồi từ khóa
    - label: Dòng chữ nhỏ trên banner
      name: bannerEyebrow
      widget: string
      required: false
    - label: Tiêu đề chính
      name: bannerTitle
      widget: string
    - label: Mô tả banner
      name: bannerDescription
      widget: text
      required: false
    - label: Chữ nút chính
      name: primaryButtonText
      widget: string
      required: false
    - label: Đường dẫn nút chính
      name: primaryButtonLink
      widget: string
      required: false
    - label: Chữ nút liên hệ
      name: secondaryButtonText
      widget: string
      required: false
    - label: Đường dẫn nút liên hệ
      name: secondaryButtonLink
      widget: string
      required: false
    - label: Chiều cao banner (px)
      name: bannerHeight
      widget: number
      value_type: int
      min: 350
      max: 850
      step: 10
      default: 610
    - label: Kích thước tiêu đề (px)
      name: bannerTitleSize
      widget: number
      value_type: int
      min: 32
      max: 80
      step: 2
      default: 56
    - label: Chiều rộng nội dung (px)
      name: bannerContentWidth
      widget: number
      value_type: int
      min: 800
      max: 1400
      step: 50
      default: 1200
    - label: Vị trí ảnh banner
      name: bannerPosition
      widget: select
      options:
      - label: Phía trên
        value: top
      - label: Chính giữa
        value: center
      - label: Phía dưới
        value: bottom
      default: center
    - label: Độ tối ảnh nền (%)
      name: bannerOverlay
      widget: number
      value_type: int
      min: 0
      max: 80
      step: 5
      default: 45
    - label: Màu nút chính
      name: primaryButtonColor
      widget: string
      default: '#D4A85E'
      hint: 'Nhập mã màu HEX, ví dụ #D4A85E'
    - label: Căn chỉnh nội dung
      name: bannerTextAlign
      widget: select
      options:
      - label: Căn trái
        value: left
      - label: Căn giữa
        value: center
      - label: Căn phải
        value: right
      default: left
    - label: Thời gian tự chuyển slide (giây)
      name: slideInterval
      widget: number
      value_type: int
      min: 3
      max: 12
      default: 5
      required: false
