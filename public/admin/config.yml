# Decap CMS | canhodanang.store | Bước 1
# Lưu ý: cập nhật Astro ở các bước sau để bật slideshow, dropdown và dải logo.
backend:
  name: github
  repo: kieucanhodanang/canhodanang-store
  branch: main
  base_url: https://canhodanang.store
  auth_endpoint: auth
media_folder: public/uploads
public_folder: /uploads
locale: vi
slug:
  encoding: ascii
  clean_accents: true
collections:
- name: can-ho
  label: Căn hộ
  label_singular: Căn hộ
  folder: src/content/can-ho
  create: true
  extension: md
  format: frontmatter
  slug: '{{slug}}'
  identifier_field: title
  fields:
  - label: Tiêu đề bài đăng
    name: title
    widget: string
  - label: Mô tả SEO (khoảng 140–160 ký tự, viết tự nhiên)
    name: description
    widget: text
  - label: SEO Title riêng (để trống dùng tiêu đề)
    name: seoTitle
    widget: string
    required: false
  - label: Thuộc dự án
    name: project
    widget: relation
    required: false
    collection: du-an
    search_fields:
    - title
    value_field: '{{slug}}'
    display_fields:
    - title
  - label: Hình thức giao dịch
    name: transaction
    widget: select
    options:
    - label: Bán
      value: ban
    - label: Cho thuê dài hạn
      value: cho-thue
    - label: Cho thuê theo ngày
      value: cho-thue-ngay
    default: ban
  - label: Tình trạng giao dịch
    name: listingStatus
    widget: select
    options:
    - label: Còn giao dịch
      value: available
    - label: Đã bán / Đã cho thuê
      value: closed
    - label: Tạm ngừng
      value: paused
    default: available
  - label: Giá bán hoặc cho thuê
    name: price
    widget: string
  - label: Diện tích (m²)
    name: area
    widget: string
  - label: Số phòng ngủ
    name: bedrooms
    widget: number
    required: false
    value_type: int
    min: 0
  - label: Số phòng vệ sinh
    name: bathrooms
    widget: number
    required: false
    value_type: int
    min: 0
  - label: Quận / Khu vực
    name: district
    widget: select
    options:
    - label: Hải Châu
      value: Hải Châu
    - label: Sơn Trà
      value: Sơn Trà
    - label: Ngũ Hành Sơn
      value: Ngũ Hành Sơn
    - label: Thanh Khê
      value: Thanh Khê
    - label: Liên Chiểu
      value: Liên Chiểu
    - label: Cẩm Lệ
      value: Cẩm Lệ
    - label: Hòa Vang
      value: Hòa Vang
    - label: Khu vực khác
      value: Khu vực khác
    required: false
  - label: Phường / Xã
    name: ward
    widget: string
    required: false
  - label: Địa chỉ bất động sản
    name: address
    widget: string
  - label: Thông tin pháp lý
    name: legal
    widget: string
    required: false
  - label: Hướng căn hộ
    name: direction
    widget: select
    required: false
    options:
    - Đông
    - Tây
    - Nam
    - Bắc
    - Đông Bắc
    - Đông Nam
    - Tây Bắc
    - Tây Nam
  - label: Thư viện hình ảnh
    name: gallery
    widget: list
    required: false
    field:
      label: Hình ảnh
      name: image
      widget: image
  - label: Ảnh chia sẻ mạng xã hội
    name: ogImage
    widget: image
    required: false
  - label: Ảnh đại diện
    name: image
    widget: image
  - label: Alt Text ảnh đại diện
    name: imageAlt
    widget: string
    required: false
  - label: Ngày đăng
    name: date
    widget: datetime
    required: false
    date_format: YYYY-MM-DD
    time_format: HH:mm
    format: YYYY-MM-DDTHH:mm:ss
  - label: Ngày cập nhật
    name: updatedAt
    widget: datetime
    required: false
    date_format: YYYY-MM-DD
    time_format: HH:mm
    format: YYYY-MM-DDTHH:mm:ss
  - label: Trạng thái xuất bản
    name: status
    widget: select
    options:
    - label: Công khai
      value: published
    - label: Bản nháp / Ẩn
      value: draft
    default: published
  - label: Hiển thị trên trang chủ
    name: showOnHome
    widget: boolean
    default: true
  - label: Ghim nổi bật trên trang chủ
    name: featured
    widget: boolean
    default: false
  - label: Thứ tự ưu tiên (số nhỏ lên trước)
    name: featuredOrder
    widget: number
    required: false
    value_type: int
    min: 1
  - label: Nội dung chi tiết
    name: body
    widget: markdown
