# Decap CMS | canhodanang.store | Nâng cấp dữ liệu dự án
backend:
  name: github
  repo: kieucanhodanang/canhodanang-store
  branch: main
  base_url: https://canhodanang.store
  auth_endpoint: auth
media_folder: public/uploads
public_folder: /uploads
locale: vi
slug:
  encoding: ascii
  clean_accents: true
collections:
- name: can-ho
  label: Căn hộ
  label_singular: Căn hộ
  folder: src/content/can-ho
  create: true
  extension: md
  format: frontmatter
  slug: '{{slug}}'
  identifier_field: title
  fields:
  - &id002
    label: Tiêu đề bài đăng
    name: title
    widget: string
  - &id003
    label: Mô tả SEO (khoảng 140–160 ký tự, viết tự nhiên)
    name: description
    widget: text
  - &id004
    label: SEO Title riêng (để trống dùng tiêu đề)
    name: seoTitle
    widget: string
    required: false
  - &id016
    label: Thuộc dự án
    name: project
    widget: relation
    required: false
    collection: du-an
    search_fields: &id028
    - title
    value_field: '{{slug}}'
    display_fields: &id029
    - title
  - label: Phân khu Vinhomes Hải Vân Bay
    name: subdivision
    condition: { field: project, value: vinhomes-hai-van-bay }
    widget: select
    required: false
    hint: Chỉ chọn khi sản phẩm thuộc dự án Vinhomes Hải Vân Bay.
    options:
    - { label: Tinh Vân, value: tinh-van }
    - { label: Bạch Vân, value: bach-van }
    - { label: Đảo Ngọc, value: dao-ngoc }
    - { label: Vịnh Mây, value: vinh-may }
  - label: Loại hình sản phẩm trong Vinhomes Hải Vân Bay
    name: projectPropertyType
    condition: { field: project, value: vinhomes-hai-van-bay }
    widget: select
    required: false
    hint: Chỉ chọn khi sản phẩm thuộc dự án Vinhomes Hải Vân Bay.
    options:
    - { label: Biệt thự đơn lập, value: biet-thu-don-lap }
    - { label: Biệt thự song lập, value: biet-thu-song-lap }
    - { label: Biệt thự liền kề, value: biet-thu-lien-ke }
    - { label: Shophouse, value: shophouse }
    - { label: Căn hộ cao tầng, value: can-ho-cao-tang }
    - { label: Resort, value: resort }
  - label: Mã sản phẩm trong dự án
    name: productCode
    condition: { field: project, value: vinhomes-hai-van-bay }
    widget: string
    required: false
    hint: Ví dụ TV-001, chỉ dùng cho sản phẩm thuộc dự án.
  - &id017
    label: Hình thức giao dịch
    name: transaction
    widget: select
    options:
    - label: Bán
      value: ban
    - label: Cho thuê dài hạn
      value: cho-thue
    - label: Cho thuê theo ngày
      value: cho-thue-ngay
    default: ban
  - &id018
    label: Tình trạng giao dịch
    name: listingStatus
    widget: select
    options:
    - label: Còn giao dịch
      value: available
    - label: Đã bán / Đã cho thuê
      value: closed
    - label: Tạm ngừng
      value: paused
    default: available
  - label: Giá bán hoặc cho thuê
    name: price
    widget: string
  - &id023
    label: Giá để lọc (triệu đồng)
    name: priceValue
    widget: number
    value_type: float
    min: 0
    required: false
    hint: 'Nhập số, không kèm đơn vị. Bán: 3,5 tỷ = 3500. Thuê tháng: 15 triệu = 15. Thuê ngày: 800 nghìn/đêm = 0.8.'
  - &id021
    label: Diện tích (m²)
    name: area
    widget: string
  - &id022
    label: Diện tích để lọc (m²)
    name: areaValue
    widget: number
    value_type: float
    min: 0
    required: false
    hint: Nhập số, ví dụ 75.5. Thanh trượt trang chủ hiển thị khoảng 25–125 m².
  - label: Loại hình căn hộ
    name: apartmentType
    widget: select
    required: false
    hint: Chọn loại hình căn hộ để hiển thị và lọc chính xác (1PN+ khác 1PN). Không thay thế trường Số phòng ngủ.
    options:
    - label: STU
      value: STU
    - label: 1PN
      value: 1PN
    - label: 1PN+
      value: 1PN+
    - label: 2PN
      value: 2PN
    - label: 2PN+
      value: 2PN+
    - label: 3PN
      value: 3PN
    - label: Duplex / Penthouse
      value: Duplex / Penthouse
  - &id026
    label: Số phòng ngủ
    name: bedrooms
    widget: number
    required: false
    value_type: int
    min: 0
  - &id027
    label: Số phòng vệ sinh
    name: bathrooms
    widget: number
    required: false
    value_type: int
    min: 0
  - label: Khu vực căn hộ (danh mục SEO)
    name: areaSlug
    widget: select
    required: false
    hint: Chọn khu vực để phân loại căn hộ trên website. Giữ nguyên Quận / Khu vực và Phường / Xã bên dưới để ghi địa chỉ
      thực tế.
    options:
    - label: Sơn Trà
      value: son-tra
    - label: Ngũ Hành Sơn
      value: ngu-hanh-son
    - label: Hải Châu
      value: hai-chau
  - label: Quận / Khu vực
    name: district
    widget: select
    options: &id030
    - label: Hải Châu
      value: Hải Châu
    - label: Sơn Trà
      value: Sơn Trà
    - label: Ngũ Hành Sơn
      value: Ngũ Hành Sơn
    - label: Thanh Khê
      value: Thanh Khê
    - label: Liên Chiểu
      value: Liên Chiểu
    - label: Cẩm Lệ
      value: Cẩm Lệ
    - label: Hòa Vang
      value: Hòa Vang
    - label: Khu vực khác
      value: Khu vực khác
    required: false
  - &id020
    label: Phường / Xã
    name: ward
    widget: string
    required: false
  - label: Địa chỉ bất động sản
    name: address
    widget: string
  - &id025
    label: Thông tin pháp lý
    name: legal
    widget: select
    required: false
    options:
    - Sổ hồng lâu dài
    - Hợp đồng mua bán
    - Văn bản thỏa thuận
    - Đang chờ cấp sổ
    - Sở hữu 50 năm
    - Sở hữu lâu dài
    - Khác
    hint: Chọn theo hồ sơ thực tế của căn hộ; nếu chưa xác minh, để trống.
  - label: Hướng căn hộ
    name: direction
    widget: select
    required: false
    options: &id001
    - Đông
    - Tây
    - Nam
    - Bắc
    - Đông Bắc
    - Đông Nam
    - Tây Bắc
    - Tây Nam
  - label: Hướng ban công
    name: balconyDirection
    widget: select
    required: false
    options: *id001
  - &id024
    label: Nội thất
    name: interior
    widget: string
    required: false
    hint: 'Ví dụ: Đầy đủ nội thất, Nội thất cơ bản, Bàn giao thô.'
  - &id005
    label: Thư viện hình ảnh
    name: gallery
    widget: list
    required: false
    field:
      label: Hình ảnh
      name: image
      widget: image
  - &id006
    label: Ảnh chia sẻ mạng xã hội
    name: ogImage
    widget: image
    required: false
  - &id007
    label: Ảnh đại diện
    name: image
    widget: image
  - &id008
    label: Alt Text ảnh đại diện
    name: imageAlt
    widget: string
    required: false
  - &id009
    label: Ngày đăng
    name: date
    widget: datetime
    required: false
    date_format: YYYY-MM-DD
    time_format: HH:mm
    format: YYYY-MM-DDTHH:mm:ss
  - &id010
    label: Ngày cập nhật
    name: updatedAt
    widget: datetime
    required: false
    date_format: YYYY-MM-DD
    time_format: HH:mm
    format: YYYY-MM-DDTHH:mm:ss
  - &id011
    label: Trạng thái xuất bản
    name: status
    widget: select
    options:
    - label: Công khai
      value: published
    - label: Bản nháp / Ẩn
      value: draft
    default: published
  - &id012
    label: Hiển thị trên trang chủ
    name: showOnHome
    widget: boolean
    default: true
  - &id013
    label: Ghim nổi bật trên trang chủ
    name: featured
    widget: boolean
    default: false
  - &id014
    label: Thứ tự ưu tiên (số nhỏ lên trước)
    name: featuredOrder
    widget: number
    required: false
    value_type: int
    min: 1
  - &id015
    label: Nội dung chi tiết
    name: body
    widget: markdown
- name: du-an
  label: Dự án bất động sản
  label_singular: Dự án bất động sản
  folder: src/content/du-an
  create: true
  extension: md
  format: frontmatter
  slug: '{{fields.slug}}'
  identifier_field: title
  fields:
  - *id002
  - label: SEO Title riêng (để trống để hệ thống tự tạo)
    name: seoTitle
    widget: string
    required: false
    hint: 'Tiêu đề trang trên Google. Nếu để trống, hệ thống dùng tên và vị trí dự án.'
  - label: Meta Description riêng (để trống để hệ thống tự tạo)
    name: seoDescription
    widget: text
    required: false
    hint: 'Viết mô tả SEO tự nhiên, khoảng 140–160 ký tự. Không ảnh hưởng phần giới thiệu hiển thị trên trang.'
  - label: Slug dự án (đường dẫn URL)
    name: slug
    widget: string
    required: true
    pattern:
    - ^[a-z0-9]+(?:-[a-z0-9]+)*$
    - 'Chỉ dùng chữ thường không dấu, số và dấu gạch ngang. Ví dụ: capital-square'
    hint: 'Ví dụ: capital-square. Không nhập /du-an/ hoặc .md. Sau khi xuất bản không nên đổi slug vì sẽ đổi URL.'
  - *id003
  - label: Chủ đầu tư
    name: developer
    widget: string
    required: false
  - label: Vị trí dự án
    name: location
    widget: string
  - label: Hình thức sở hữu
    name: ownership
    widget: select
    required: false
    options:
    - Sở hữu lâu dài
    - Sở hữu 50 năm
    - Khác / Theo pháp lý dự án
    hint: Chọn theo hồ sơ pháp lý chính thức của dự án. Để trống nếu chưa xác minh.
  - label: Quận / Khu vực dự án
    name: district
    widget: select
    required: false
    options: &id019
    - Hải Châu
    - Sơn Trà
    - Ngũ Hành Sơn
    - Thanh Khê
    - Liên Chiểu
    - Cẩm Lệ
    - Hòa Vang
    - Khu vực khác
    hint: Dùng để tự động lấy các dự án liên quan cùng quận.
  - label: Tổng diện tích dự án
    name: totalArea
    widget: string
    required: false
    hint: 'Ví dụ: 2,5 ha hoặc 25.000 m²'
  - label: Số tòa
    name: towerCount
    widget: string
    required: false
  - label: Số căn hộ / biệt thự
    name: unitCount
    widget: string
    required: false
  - label: Thời gian bàn giao dự kiến
    name: handoverDate
    widget: string
    required: false
  - label: Mật độ xây dựng
    name: buildingDensity
    widget: string
    required: false
  - label: Slogan mở đầu dự án (giao diện mới)
    name: introSlogan
    widget: object
    required: false
    collapsed: true
    hint: 'Mỗi dự án có slogan riêng. Ba phần sẽ ghép thành một tiêu đề lớn, phần nhấn mạnh có màu vàng đồng. Để trống sẽ dùng slogan mặc định.'
    fields:
    - label: Dòng mở đầu
      name: firstLine
      widget: string
      required: false
      hint: 'Ví dụ: Một góc nhìn'
    - label: Cụm từ nhấn mạnh màu vàng đồng
      name: highlight
      widget: string
      required: false
      hint: 'Ví dụ: không gian'
    - label: Dòng kết
      name: lastLine
      widget: string
      required: false
      hint: 'Ví dụ: sống.'
  - label: SECTION BUILDER — Nội dung dự án
    name: contentLayers
    widget: list
    required: false
    collapsed: true
    summary: '{{fields.heading}} — {{fields.type}}'
    hint: 'Tự tạo Section H2 và kéo thả thứ tự. Hero, form tư vấn, sản phẩm, tin tức là phần cố định. Các trường [Dữ liệu cũ] chỉ dùng cho giao diện cũ, không cần nhập lại.'
    fields:
    - label: Hiển thị Section
      name: enabled
      widget: boolean
      default: true
      required: false
    - label: Tên Section trong CMS
      name: adminLabel
      widget: string
      required: false
      hint: 'Chỉ dùng để quản trị, không hiển thị ngoài website.'
    - label: Kiểu Section
      name: type
      widget: select
      required: false
      hint: 'Chọn kiểu bố cục. Section cũ chưa có trường này vẫn được giữ nguyên.'
      options:
      - { label: 'A — Ảnh và nội dung trái/phải', value: split }
      - { label: 'B — Nội dung trên, gallery dưới', value: text-gallery }
      - { label: 'C — Bộ sưu tập 4 ảnh', value: four-images }
      - { label: 'D — Ảnh lớn toàn chiều ngang', value: full-image }
      - { label: 'E — Văn bản chuyên sâu', value: rich-text }
      - { label: 'F — Google Maps và tiện ích', value: map-amenities }
      - { label: 'G — Tab mặt bằng / tiến độ', value: tabs }
    - label: Tiêu đề Section (H2)
      name: heading
      widget: string
      required: false
      hint: 'Không nhập lại tên dự án hoặc tiêu đề H1.'
    - label: Phụ đề Section (H3)
      name: subheading
      widget: string
      required: false
    - label: Nội dung Section
      name: text
      widget: markdown
      required: false
      hint: 'Nội dung chính của Section, hiển thị căn đều hai bên trên desktop.'
    - label: Kiểu bố cục
      name: layout
      widget: select
      default: split
      options:
      - label: 'A — Chia đôi ảnh và chữ'
        value: split
      - label: 'B — Tiêu đề, nội dung, hàng ảnh bên dưới'
        value: text-gallery
      - label: 'C — Ảnh lớn toàn chiều ngang'
        value: full-image
    - label: Vị trí ảnh (áp dụng kiểu A)
      name: imageSide
      widget: select
      required: false
      options:
      - label: Tự động xen kẽ
        value: auto
      - label: Ảnh bên trái
        value: left
      - label: Ảnh bên phải
        value: right
    - label: Ảnh và câu chuyện trong Section
      name: images
      widget: list
      required: false
      collapsed: true
      summary: '{{fields.captionTitle}}'
      hint: 'Một ảnh phủ ngang Section, hai ảnh chia đều, từ ba ảnh trở lên dùng gallery trượt. Mô tả bên dưới mỗi ảnh căn giữa.'
      fields:
      - label: Ảnh
        name: image
        widget: image
        required: true
      - label: Tiêu đề câu chuyện
        name: captionTitle
        widget: string
        required: false
      - label: Mô tả dưới ảnh
        name: caption
        widget: text
        required: false
      - label: Alt Text ảnh
        name: imageAlt
        widget: string
        required: false
    - label: Các tab mặt bằng hoặc tiến độ (kiểu G)
      name: tabs
      widget: list
      required: false
      collapsed: true
      summary: '{{fields.title}}'
      fields:
      - { label: Tên tab, name: title, widget: string }
      - { label: Ảnh tab, name: image, widget: image, required: false }
      - { label: Alt ảnh, name: imageAlt, widget: string, required: false }
      - { label: Nội dung tab, name: text, widget: markdown, required: false }
    - label: Mã HTML nhúng Google Maps (kiểu F)
      name: mapEmbed
      widget: text
      required: false
      hint: 'Chỉ dán iframe nhúng Google Maps hợp lệ.'
    - label: Danh sách tiện ích (kiểu F)
      name: amenities
      widget: list
      required: false
      collapsed: true
      summary: '{{fields.name}}'
      fields:
      - { label: Tên địa điểm, name: name, widget: string }
      - { label: Khoảng cách, name: distance, widget: string, required: false }
      - { label: Thời gian di chuyển, name: travelTime, widget: string, required: false }
      - { label: Ghi chú, name: note, widget: text, required: false }
  - label: Ảnh đại diện 4 phân khu Vinhomes Hải Vân Bay
    name: haiVanZoneImages
    widget: object
    required: false
    collapsed: true
    hint: Chỉ sử dụng cho dự án Vinhomes Hải Vân Bay. Tải ảnh ngang WebP/JPG để hiển thị trên 4 thẻ phân khu.
    fields:
    - label: Ảnh phân khu Tinh Vân
      name: tinhVan
      widget: image
      required: false
    - label: Ảnh phân khu Bạch Vân
      name: bachVan
      widget: image
      required: false
    - label: Ảnh phân khu Đảo Ngọc
      name: daoNgoc
      widget: image
      required: false
    - label: Ảnh phân khu Vịnh Mây
      name: vinhMay
      widget: image
      required: false
  - label: Loại hình trong dự án
    name: propertyTypes
    widget: select
    required: false
    multiple: true
    options:
    - label: Căn hộ
      value: can-ho
    - label: Biệt thự
      value: biet-thu
    - label: Shophouse
      value: shophouse
    - label: Nhà phố
      value: nha-pho
    - label: Đất nền
      value: dat-nen
  - *id005
  - *id006
  - *id007
  - *id008
  - label: Logo dự án (hiển thị trong dải logo Footer)
    name: logo
    widget: image
    required: false
    hint: Ưu tiên PNG/WebP nền trong suốt, ảnh ngang rõ nét.
  - label: Alt Text logo dự án
    name: logoAlt
    widget: string
    required: false
  - label: Trạng thái phân phối
    name: distributionStatus
    widget: select
    default: dang-phan-phoi
    options:
    - label: Đang phân phối
      value: dang-phan-phoi
    - label: Sắp mở bán
      value: sap-mo-ban
    - label: Ngừng phân phối
      value: ngung-phan-phoi
  - label: Hiển thị logo trong Footer
    name: showLogoInFooter
    widget: boolean
    default: true
  - label: Thứ tự logo Footer (số nhỏ ưu tiên trước)
    name: logoOrder
    widget: number
    required: false
    value_type: int
    min: 1
  - label: Hiển thị dự án trong menu dropdown
    name: showInMenu
    widget: boolean
    default: true
  - *id009
  - *id010
  - *id011
  - *id012
  - *id013
  - *id014
  - *id015
  - label: [Dữ liệu cũ] Google Maps
    name: googleMapsEmbed
    widget: text
    required: false
    hint: 'Google Maps → Chia sẻ → Nhúng bản đồ → Sao chép HTML. Chỉ dán mã iframe Google Maps; website sẽ kiểm tra đường dẫn hợp lệ.'
  - label: [Dữ liệu cũ] Hiển thị bản đồ
    name: showGoogleMap
    widget: boolean
    default: true
    required: false
  - label: [Dữ liệu cũ] Tiện ích xung quanh
    name: nearbyAmenities
    widget: list
    required: false
    collapsed: true
    summary: '{{fields.name}} — {{fields.distance}}'
    hint: 'Thêm từng địa điểm, kéo thả để đổi thứ tự. Chỉ nhập thông tin đã kiểm tra.'
    fields:
    - label: Tên địa điểm hoặc tiện ích
      name: name
      widget: string
      required: true
    - label: Khoảng cách
      name: distance
      widget: string
      required: false
      hint: 'Ví dụ: 2,5 km. Có thể để trống.'
    - label: Thời gian di chuyển
      name: travelTime
      widget: string
      required: false
      hint: 'Ví dụ: khoảng 8 phút đi ô tô; chỉ nhập nếu đã kiểm tra.'
    - label: Ghi chú ngắn
      name: note
      widget: text
      required: false
  - label: [Dữ liệu cũ] Nội dung mặt bằng
    name: floorPlanText
    widget: markdown
    required: false
    hint: 'Chèn ảnh bằng nút hình ảnh trong trình soạn thảo; ảnh, chữ và liên kết có thể xen kẽ.'
  - label: [Dữ liệu cũ] Bộ sưu tập mặt bằng
    name: floorPlanItems
    widget: list
    required: false
    collapsed: true
    summary: '{{fields.title}}'
    hint: 'Mỗi mục gồm ảnh, tiêu đề và mô tả tương ứng. Kéo thả để thay đổi thứ tự tab. Ảnh mặt bằng hiển thị đầy đủ, không crop.'
    fields:
    - label: Tên mặt bằng (H3)
      name: title
      widget: string
      required: true
      hint: 'Ví dụ: Mặt bằng tầng điển hình. Không nhập lại tiêu đề H1 của dự án.'
    - label: Ảnh mặt bằng
      name: image
      widget: image
      required: true
    - label: Mô tả mặt bằng
      name: description
      widget: text
      required: false
      hint: 'Mô tả chính xác mặt bằng trong ảnh; tránh sao chép nguyên mô tả tổng quan.'
    - label: Mô tả ảnh (Alt Text)
      name: imageAlt
      widget: string
      required: false
      hint: 'Ví dụ: Sơ đồ mặt bằng tầng 5 dự án Capital Square.'
  - label: [Dữ liệu cũ] Nội dung tiến độ
    name: progressText
    widget: markdown
    required: false
    hint: 'Chèn ảnh trực tiếp vào nội dung Markdown, không cần tạo danh sách ảnh riêng.'
